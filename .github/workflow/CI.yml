name: CI

on:
  push:
    branches: [ "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Отримання коду
        uses: actions/checkout@v5
      - name: Ініціалізація Python
        uses: actions/setup-python@5
        with:
          python-version: "3.10.4"
      - name: Інсталяція залежностей
        run: pip install -r requirements.txt
      - name: Тестування
        run: make test
      -name: Лінтинг
        run: make lint
      -name: Перевірка залежностей
        run: make check
